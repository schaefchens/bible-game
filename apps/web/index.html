<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Walk in the Spirit</title>
    <meta name="description" content="Walk in the Spirit — a pilgrim's roguelike" />
    <meta name="theme-color" content="#11140f" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Walk in the Spirit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      /* Paint black from the very first frame, before the CSS/JS bundle loads, so a slow load never
         flashes white — the studio intro and the app are dark. */
      html, body { margin: 0; background: #000; }
    </style>
    <script>
      /* Catch `beforeinstallprompt` before the app bundle exists. The module script below is
         DEFERRED, so on a warm visit Chrome can fire this event while the document is still being
         parsed — minutes of debugging if you only listen from React. Park it here; the app adopts
         whatever is parked (and keeps its own listener, because Chrome re-fires the event whenever
         installability is re-evaluated). preventDefault() suppresses Chrome's mini-infobar so the
         app alone decides when to ask. Feature is driven by the ?install=1 deep link —
         see src/pwa/installPrompt.ts, which explains the whole timing dance. */
      window.__wisInstallEvent = null
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault()
        window.__wisInstallEvent = e
      })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
