# Drop-in for certbot-boot-renew.service.
#
# `certbot renew` run non-interactively sleeps a random 0–8 minutes before
# renewing, to spread load across the ACME servers. On a normal host that is
# invisible. Here it is the boot path of a server that gets created on demand
# while a player waits for the co-op lobby to open.
#
# It only triggers when a certificate is actually due, so most boots are
# unaffected — which is exactly what makes it easy to miss. The one boot in
# sixty where the cert needs renewing would take up to eight minutes, past the
# client's six-minute give-up in serverResolve.ts. That was already observed
# once: the first boot after the domain move sat in this sleep for 3m20s.
#
# The load-spreading it exists for is irrelevant to a host that renews at most
# a handful of times a year, so opt out and boot promptly.
[Service]
ExecStart=
ExecStart=/usr/bin/certbot renew --quiet --no-random-sleep-on-renew --deploy-hook "systemctl reload nginx"
