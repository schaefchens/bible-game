# The on-demand co-op server's nginx vhost.
#
# Installed by deploy/server/provision.sh. This box is the WebSocket and
# nothing else — the game itself is static files on the webhosting now, so the
# old `/game/` alias and its `/game/ws` compatibility route are gone with it.
#
# certbot --nginx extends this block in place with the 443 listener, the
# certificate paths, and an http→https redirect. Re-running provision.sh
# rewrites the file and re-runs certbot, which puts them back.

server {
    listen 80;
    listen [::]:80;

    server_name COOP_HOST_PLACEHOLDER;

    # Let certbot answer the ACME challenge from disk. Without this the
    # `location /` below would 404 the validation request.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nothing in the protocol pings. apps/server has no ws ping/pong, and
        # the client's only timer is the 5-minute HTTP wake heartbeat, which
        # never touches this socket (net/client.ts). At nginx's default
        # proxy_read_timeout of 60s a party that spends a minute reading a
        # dialogue node or picking a card gets silently disconnected — the old
        # vhost had exactly that gap. An hour is longer than the wake endpoint's
        # own idle window, so the server is destroyed before nginx gives up.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Nothing else lives here. A 404 is cheaper and quieter than a default page,
    # and makes it obvious in the logs if something is pointed at the wrong host.
    location / {
        return 404;
    }
}
